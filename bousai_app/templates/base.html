<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>{% block title %}防災アプリ{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --theme-blue: #2457a6;
      --theme-blue-dark: #1d4b96;
      --theme-ink: #244268;
      --theme-muted: #607287;
      --theme-line: #dce6f2;
      --theme-background: #eef5fc;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--theme-ink);
      background: linear-gradient(135deg, #f8fbff 0%, var(--theme-background) 100%);
      font-family: 'Noto Sans JP', sans-serif;
    }
    .site-header {
      height: 70px;
      color: white;
      background: linear-gradient(110deg, var(--theme-blue-dark), #2c62b1);
      box-shadow: 0 2px 8px rgba(22, 59, 112, .16);
    }
    .header-inner {
      width: min(100% - 48px, 1380px);
      height: 100%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      color: white;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: .04em;
      text-decoration: none;
    }
    .menu-button {
      width: 40px;
      height: 40px;
      border: 0;
      background: transparent;
      display: grid;
      align-content: center;
      gap: 5px;
      cursor: pointer;
    }
    .menu-button span {
      width: 23px;
      height: 3px;
      margin: auto;
      background: white;
      border-radius: 2px;
    }
    .site-nav {
      position: absolute;
      top: 70px;
      right: 24px;
      z-index: 1000;
      display: none;
      padding: 8px;
      background: white;
      border: 1px solid var(--theme-line);
      border-radius: 10px;
      box-shadow: 0 12px 28px rgba(30, 61, 100, .16);
    }
    .site-nav.is-open { display: grid; }
    .site-nav a {
      padding: 10px 18px;
      color: var(--theme-ink);
      text-decoration: none;
      white-space: nowrap;
    }
    .site-nav a:hover { background: #f0f5fc; }
    .page-content {
      width: min(100% - 48px, 980px);
      min-height: calc(100vh - 70px);
      margin: auto;
      padding: 38px 0 80px;
    }
    .page-content > h2,
    .page-content > p,
    .page-content > form,
    .page-content > table,
    .page-content > h3 {
      max-width: 760px;
      margin-right: auto;
      margin-left: auto;
    }
    .page-content > h2 {
      margin-top: 0;
      padding-bottom: 14px;
      color: var(--theme-blue);
      border-bottom: 3px solid var(--theme-blue);
      font-size: 28px;
    }
    .page-content > p { color: var(--theme-muted); }
    .page-content > p a,
    .page-content a:not(.brand):not(.site-nav a) { color: var(--theme-blue); font-weight: 700; }
    .page-content form,
    .page-content table {
      padding: 24px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid var(--theme-line);
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(52, 79, 110, .08);
    }
    .page-content form p { margin: 0 0 18px; }
    .page-content label { color: var(--theme-ink); font-weight: 700; }
    .page-content input {
      width: min(100%, 440px);
      margin-top: 8px;
      padding: 11px 13px;
      border: 1px solid #bfd0e3;
      border-radius: 7px;
      color: var(--theme-ink);
      background: white;
      font: inherit;
    }
    .page-content input:focus { outline: 3px solid #cfe0f5; border-color: var(--theme-blue); }
    .page-content button {
      padding: 10px 25px;
      border: 0;
      border-radius: 7px;
      color: white;
      background: var(--theme-blue);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .page-content button:hover { background: var(--theme-blue-dark); }
    .page-content table { width: 100%; border-collapse: collapse; }
    .page-content th,
    .page-content td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--theme-line); }
    .page-content th { color: white; background: var(--theme-blue); }
    .page-content tr:last-child td { border-bottom: 0; }
    @media (max-width: 640px) {
      .header-inner { width: min(100% - 28px, 1380px); }
      .brand { font-size: 22px; }
      .page-content { width: min(100% - 24px, 980px); padding: 24px 0 48px; }
      .page-content > h2 { font-size: 23px; }
      .page-content form,
      .page-content table { padding: 16px; }
    }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ url_for('index') }}">防災アプリ</a>
      <button class="menu-button" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="siteNav">
        <span></span><span></span><span></span>
      </button>
      <nav id="siteNav" class="site-nav" aria-label="メインメニュー">
        <a href="{{ url_for('index') }}">ホーム</a>
        <a href="{{ url_for('shelter_search') }}">避難所検索</a>
        <a href="{{ url_for('shelter_register') }}">避難所登録</a>
        <a href="{{ url_for('board') }}">指示・発信ボード</a>
        {% if session.logged_in %}
          <a href="{{ url_for('logout') }}">ログアウト</a>
        {% else %}
          <a href="{{ url_for('login') }}">ログイン</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="page-content">
    {% block content %}{% endblock %}
  </main>
  <script>
    const menuButton = document.querySelector('.menu-button');
    const siteNav = document.querySelector('.site-nav');
    if (menuButton && siteNav) {
      menuButton.addEventListener('click', () => {
        const isOpen = siteNav.classList.toggle('is-open');
        menuButton.setAttribute('aria-expanded', String(isOpen));
      });
    }
  </script>
</body>
</html>
